# Change this exact class placeholder after running doctor.
$grokbot_class = grok-bot
workspace = special:grokbot, gapsout:30, gapsin:0
windowrulev2 = workspace special:grokbot silent, class:^($grokbot_class)$
windowrulev2 = float, class:^($grokbot_class)$
windowrulev2 = size 80% 70%, class:^($grokbot_class)$
windowrulev2 = move 10% 5%, class:^($grokbot_class)$
bind = SUPER, G, togglespecialworkspace, grokbot
bind = SUPER SHIFT, G, exec, bash ~/.config/omarchy/current/theme/grokbot/waybar/grokbot-screenshot.sh
