# Legacy Hyprland conf syntax; see README for newer Lua installations.
$activeBorderColor = rgb(4fd1ff)
general {
    col.active_border = $activeBorderColor
    col.inactive_border = rgb(343a40)
}
group {
    col.border_active = $activeBorderColor
    col.border_inactive = rgb(343a40)
}
source = ~/.config/omarchy/current/theme/grokbot/hyprland/scratchpad.conf
